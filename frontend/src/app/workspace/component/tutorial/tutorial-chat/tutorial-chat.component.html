<ng-container *ngIf="isTutorialActive">
  <!-- One-time nudge bubble pointing at Argus. Disappears the moment the
       user opens the chat for the first time, so it never re-appears
       mid-tour. -->
  <div
    *ngIf="!isOpen && !hasOpenedChatOnce"
    class="argus-nudge"
    (click)="togglePanel()">
    I'm your tutor — ask me anything!
  </div>

  <!-- Floating Argus = the agent. Click to open the chat. -->
  <button
    class="argus-toggle-btn"
    type="button"
    nz-tooltip
    [nzTooltipTitle]="isOpen ? '' : 'Ask Argus about this step'"
    nzTooltipPlacement="left"
    (click)="togglePanel()">
    <texera-argus
      [state]="argusState"
      [size]="38"></texera-argus>
  </button>

  <div
    class="chat-panel"
    [class.open]="isOpen">
    <div class="chat-header">
      <texera-argus
        [state]="argusState"
        [size]="32"
        class="chat-header-argus"></texera-argus>
      <span class="chat-header-title">Argus — your Texera tutor</span>
      <button
        nz-button
        nzType="text"
        nzSize="small"
        class="chat-close-btn"
        (click)="closePanel()">
        <span
          nz-icon
          nzType="close"></span>
      </button>
    </div>

    <div
      class="chat-messages"
      #messageContainer>
      <div
        *ngFor="let msg of visibleMessages"
        class="chat-message"
        [ngClass]="msg.role === 'user' ? 'user-message' : 'agent-message'">
        <div class="message-bubble">
          <span
            *ngIf="msg.role !== 'user'"
            class="message-icon"
            >🦚</span
          >
          <div class="message-content">{{ msg.content }}</div>
        </div>
      </div>

      <div
        *ngIf="isSending"
        class="chat-message agent-message">
        <div class="message-bubble">
          <span class="message-icon">🦚</span>
          <div class="typing-indicator"><span></span><span></span><span></span></div>
        </div>
      </div>
    </div>

    <div class="chat-input-area">
      <input
        nz-input
        class="chat-input"
        placeholder="Ask Argus..."
        [(ngModel)]="inputText"
        (keydown)="onKeyEnter($event)"
        [disabled]="isSending" />
      <button
        nz-button
        nzType="primary"
        nzSize="small"
        class="chat-send-btn"
        [disabled]="!inputText.trim() || isSending"
        (click)="sendMessage()">
        <span
          nz-icon
          nzType="send"></span>
      </button>
    </div>
  </div>
</ng-container>
