<ng-container *ngIf="isTutorialActive">
  <button
    class="chat-toggle-btn"
    nz-button
    nzType="primary"
    nz-tooltip
    [nzTooltipTitle]="isOpen ? '' : 'Ask AI about this step'"
    nzTooltipPlacement="left"
    (click)="togglePanel()">
    <span
      nz-icon
      [nzType]="isOpen ? 'close' : 'robot'"></span>
    <span
      *ngIf="!isOpen"
      class="chat-btn-label">Ask AI</span>
  </button>

  <div
    class="chat-panel"
    [class.open]="isOpen">
    <div class="chat-header">
      <span
        nz-icon
        nzType="robot"
        style="font-size:18px; color:#fff"></span>
      <span class="chat-header-title">Tutorial Assistant</span>
      <button
        nz-button
        nzType="text"
        nzSize="small"
        class="chat-close-btn"
        (click)="closePanel()">
        <span
          nz-icon
          nzType="close"></span>
      </button>
    </div>

    <div
      class="chat-messages"
      #messageContainer>
      <div
        *ngFor="let msg of visibleMessages"
        class="chat-message"
        [ngClass]="msg.role === 'user' ? 'user-message' : 'agent-message'">
        <div class="message-bubble">
          <span
            *ngIf="msg.role !== 'user'"
            class="message-icon">🤖</span>
          <div class="message-content">{{ msg.content }}</div>
        </div>
      </div>

      <div
        *ngIf="isSending"
        class="chat-message agent-message">
        <div class="message-bubble">
          <span class="message-icon">🤖</span>
          <div class="typing-indicator">
            <span></span><span></span><span></span>
          </div>
        </div>
      </div>
    </div>

    <div class="chat-input-area">
      <input
        nz-input
        class="chat-input"
        placeholder="Ask about this step..."
        [(ngModel)]="inputText"
        (keydown)="onKeyEnter($event)"
        [disabled]="isSending" />
      <button
        nz-button
        nzType="primary"
        nzSize="small"
        class="chat-send-btn"
        [disabled]="!inputText.trim() || isSending"
        (click)="sendMessage()">
        <span
          nz-icon
          nzType="send"></span>
      </button>
    </div>
  </div>
</ng-container>
