<div
  *ngIf="badge"
  class="badge-unlocked-backdrop"
  (click)="close()">
  <div
    class="badge-unlocked-card"
    (click)="$event.stopPropagation()">
    <texera-argus
      [state]="'cheer'"
      [size]="72"
      class="badge-argus"></texera-argus>
    <div class="badge-unlocked-label">Badge Unlocked!</div>
    <div
      class="badge-icon"
      [style.background]="'radial-gradient(circle at 30% 30%, #fff7d6 0%, ' + (badge.hue || '#1890ff') + ' 100%)'">
      <span class="badge-emoji">{{ badge.emoji }}</span>
    </div>
    <div class="badge-name">{{ badge.name }}</div>
    <div class="badge-desc">{{ badge.description }}</div>
    <div
      *ngIf="flowName"
      class="badge-flow-context">
      Earned during <i>{{ flowName }}</i>
    </div>

    <div class="badge-actions">
      <button
        nz-button
        nzType="default"
        (click)="close()">
        <span>Continue exploring</span>
      </button>
      <button
        nz-button
        nzType="primary"
        (click)="openShelf()">
        <span>View trophy shelf 🏆</span>
      </button>
    </div>
  </div>
</div>
